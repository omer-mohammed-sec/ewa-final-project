name: Agaseke Market CI-CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache dependencies (Backend)
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-backend-${{ hashFiles('backend/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-backend-

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Generate Prisma Client (Backend)
      run: |
        cd backend
        npx prisma generate

    - name: Cache dependencies (Frontend)
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-frontend-

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint Linter (Frontend)
      run: |
        cd frontend
        npm run lint

    - name: Build Next.js Application (Frontend)
      run: |
        cd frontend
        npm run build
      env:
        BACKEND_API_URL: "http://localhost:5000/api"
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
        NODE_ENV: "production"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image (Verify Dockerfile compilation)
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: agaseke-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend Docker Image (Verify Dockerfile compilation)
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: agaseke-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
