services:
  db:
    image: postgres:15-alpine
    container_name: agaseke-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agaseke
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agaseke"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agaseke-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/agaseke?schema=public"
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && node server.js"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agaseke-web
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: "http://backend:5000/api"
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
      NODE_ENV: "production"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
